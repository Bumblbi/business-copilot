server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html index.htm; # Добавил index.htm на всякий случай

    location / {
        # Исправлена строка try_files. 
        # Если ни $uri, ни $uri/ не найдены, Nginx возвращает index.html. 
        # Если и index.html по какой-то причине не доступен, 
        # добавление =404 или =500 в конец помогает предотвратить цикл.
        try_files $uri $uri/ /index.html =404; 
    }

    # Проксирование запросов с /api префиксом
    location /api {
        # Убираем /api префикс при проксировании
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Важно для POST запросов
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 10M;
        
        # CORS
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Credentials "true" always;
        
        # Preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "$http_origin";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Access-Control-Allow-Credentials "true";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }
}