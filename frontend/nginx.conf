server {
    listen 80;
    server_name Business-Copilot.ru;  # Замените на ваш домен
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name Business-Copilot.ru;  # Замените на ваш домен
    
    # SSL сертификаты (Let's Encrypt или ваши)
    ssl_certificate /etc/letsencrypt/live/Business-Copilot.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/Business-Copilot.ru/privkey.pem;
    
    # SSL настройки безопасности
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512;
    
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси API на FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}